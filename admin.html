<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 — 미래교육2</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .code-row td { background: #fafaf8; }
    .code-row pre {
      margin: 6px 0; padding: 10px 14px; background: #fff; border: 1px solid var(--line);
      border-radius: 8px; font-family: Consolas, monospace; font-size: 12.5px;
      overflow-x: auto; white-space: pre-wrap; max-width: 900px;
    }
    .code-row .pnum { font-weight: 700; font-size: 12.5px; }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div id="guard"></div>

    <div id="panel" hidden>
      <h2 class="section" style="margin-top:8px;">숙제 풀이 현황</h2>
      <div class="card">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <label class="field" style="margin:0;">주차
            <select id="week-select"></select>
          </label>
          <button class="btn btn-outline" id="btn-zip" style="margin-top:22px;">학생 코드 ZIP 다운로드</button>
          <span id="zip-progress" class="muted" style="margin-top:22px;"></span>
        </div>

        <div class="stat-row" id="stats"></div>

        <div class="table-wrap">
          <table class="data" id="prog-table">
            <thead>
              <tr><th>#</th><th>학번</th><th>이름</th><th>이메일</th><th>통과</th><th>상태</th><th>마지막 활동</th><th></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <h3 style="font-size:16px;margin:24px 0 8px;">미시작 학생</h3>
        <div class="pill-list" id="missing"></div>
      </div>

      <h2 class="section">마감일 관리</h2>
      <div class="card">
        <p class="muted" style="margin-top:0;">마감일을 비워두면 그 주차는 마감 없이 상시 진행됩니다. 마감 이후에 통과한 문제는 자동으로 "지각"으로 표시됩니다(차단하지는 않음).</p>
        <div class="table-wrap">
          <table class="data" id="deadline-table">
            <thead><tr><th>주차</th><th>제목</th><th>마감일시</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <h2 class="section">수강생 목록</h2>
      <div class="card">
        <p class="muted" style="margin-top:0;">사이트에 가입한 학생 명단입니다. 총 <strong id="student-count">0</strong>명.</p>
        <div id="roster-stats"></div>
        <div class="table-wrap">
          <table class="data" id="student-table">
            <thead><tr><th>#</th><th>학번</th><th>이름</th><th>이메일</th><th>가입일</th><th>전체 통과 문제</th><th>출석부</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div id="roster-missing-wrap" hidden>
          <h3 style="font-size:16px;margin:24px 0 8px;">출석부에 있지만 미가입인 학생 (<span id="roster-missing-count">0</span>명)</h3>
          <div class="pill-list" id="roster-missing"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    let students = [];      // 관리자 제외 profiles
    let allProfiles = [];   // 관리자 포함 전체 profiles (ZIP 파일명 등에 사용)
    let roster = [];        // 출석부 명단 (student_id, name, dept, seq) — 관리자 전용 테이블
    let summary = [];       // hw_summary 전체 (user_id, week, passed_count, any_late, last_activity)
    let counts = {};        // week -> 문제 수
    let problemsCache = {}; // week -> problems json

    // supabase 1000행 제한을 넘는 경우를 위한 페이지네이션 조회
    async function fetchAll(build) {
      const all = [];
      for (let from = 0; ; from += 1000) {
        const { data, error } = await build().range(from, from + 999);
        if (error) { toast("조회 실패: " + error.message, "error"); break; }
        all.push(...(data || []));
        if (!data || data.length < 1000) break;
      }
      return all;
    }

    async function loadProblems(week) {
      if (!problemsCache[week]) {
        problemsCache[week] = await fetch(`problems/week${week}.json`).then((r) => r.json());
      }
      return problemsCache[week];
    }

    async function loadRoster() {
      const [profiles, admins, sums, cnt, rosterRes] = await Promise.all([
        fetchAll(() => sb.from("profiles").select("*").order("student_id")),
        sb.from("admins").select("email").then((r) => r.data || []),
        fetchAll(() => sb.from("hw_summary").select("*")),
        fetch("problems/index.json").then((r) => r.json()),
        sb.from("roster").select("*").order("seq"),   // 출석부 명단 (없으면 무시)
      ]);
      const adminEmails = new Set(admins.map((a) => a.email.toLowerCase()));
      allProfiles = profiles;
      students = profiles.filter((p) => !adminEmails.has((p.email || "").toLowerCase()));
      summary = sums;
      counts = cnt;
      roster = rosterRes.error ? [] : (rosterRes.data || []);
    }

    function renderWeek(week) {
      const total = counts[String(week)] || 0;
      const byUser = new Map(summary.filter((s) => s.week === week).map((s) => [s.user_id, s]));
      const started = students.filter((p) => byUser.has(p.id));
      const complete = started.filter((p) => byUser.get(p.id).passed_count >= total);
      const missing = students.filter((p) => !byUser.has(p.id));

      $("#stats").innerHTML = `
        <div class="stat"><div class="num">${students.length}</div><div class="lbl">수강생(가입)</div></div>
        <div class="stat"><div class="num" style="color:var(--ok)">${complete.length}</div><div class="lbl">전부 통과</div></div>
        <div class="stat"><div class="num">${started.length - complete.length}</div><div class="lbl">진행 중</div></div>
        <div class="stat"><div class="num" style="color:var(--bad)">${missing.length}</div><div class="lbl">미시작</div></div>`;

      const tbody = $("#prog-table tbody");
      tbody.innerHTML = started.map((p, i) => {
        const s = byUser.get(p.id);
        const done = s.passed_count >= total && total > 0;
        return `<tr>
          <td>${i + 1}</td>
          <td>${esc(p.student_id)}</td>
          <td>${esc(p.name)}</td>
          <td class="muted">${esc(p.email)}</td>
          <td><strong>${s.passed_count}</strong> / ${total}</td>
          <td>${done
                ? (s.any_late ? '<span class="chip chip-warn">완료(지각)</span>' : '<span class="chip chip-ok">완료</span>')
                : '<span class="chip chip-none">진행 중</span>'}</td>
          <td>${fmtDate(s.last_activity)}</td>
          <td><button class="btn btn-ghost btn-sm" data-code="${p.id}" data-name="${esc(p.name)}">코드 보기</button></td>
        </tr>`;
      }).join("") || `<tr><td colspan="8" class="muted">아직 시작한 학생이 없습니다.</td></tr>`;

      $$("#prog-table [data-code]").forEach((btn) => {
        btn.onclick = () => toggleCode(btn, week);
      });

      $("#missing").innerHTML = missing.length
        ? missing.map((p) => `<span class="pill">${esc(p.student_id)} ${esc(p.name)}</span>`).join("")
        : `<span class="muted">모든 학생이 시작했습니다 🎉</span>`;
    }

    async function toggleCode(btn, week) {
      const tr = btn.closest("tr");
      if (tr.nextElementSibling && tr.nextElementSibling.classList.contains("code-row")) {
        tr.nextElementSibling.remove();
        return;
      }
      const probs = await loadProblems(week);
      const { data: rows } = await sb.from("hw_progress")
        .select("problem_id, code, passed, is_late, updated_at")
        .eq("user_id", btn.dataset.code).eq("week", week);
      const byId = new Map((rows || []).map((r) => [r.problem_id, r]));

      let pno = 0;
      const blocks = [];
      probs.items.forEach((item) => {
        if (item.kind !== "problem") return;
        pno++;
        const r = byId.get(item.id);
        if (!r) return;
        blocks.push(`
          <div>
            <span class="pnum">문제 ${pno}</span>
            ${r.passed ? '<span class="chip chip-ok">통과</span>' : '<span class="chip chip-none">미통과</span>'}
            ${r.is_late ? '<span class="chip chip-warn">지각</span>' : ""}
            <pre>${esc(r.code || "(코드 없음)")}</pre>
          </div>`);
      });
      const row = document.createElement("tr");
      row.className = "code-row";
      row.innerHTML = `<td colspan="8">${blocks.join("") || '<span class="muted">기록이 없습니다.</span>'}</td>`;
      tr.after(row);
    }

    function saveBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    async function downloadZip(week) {
      const prog = $("#zip-progress");
      prog.textContent = "데이터 수집 중…";
      const probs = await loadProblems(week);
      const rows = await fetchAll(() => sb.from("hw_progress")
        .select("user_id, problem_id, code, passed, is_late").eq("week", week));
      if (!rows.length) { toast("이 주차에는 기록이 없습니다.", "error"); prog.textContent = ""; return; }

      const pnum = new Map();
      let n = 0;
      probs.items.forEach((it) => { if (it.kind === "problem") pnum.set(it.id, ++n); });
      const byId = new Map(allProfiles.map((p) => [p.id, p]));
      const byUser = new Map();
      rows.forEach((r) => {
        if (!byUser.has(r.user_id)) byUser.set(r.user_id, []);
        byUser.get(r.user_id).push(r);
      });

      const zip = new JSZip();
      for (const [uid, list] of byUser) {
        const p = byId.get(uid);
        const label = p ? `${p.name}_${p.student_id}` : uid.slice(0, 8);
        list.sort((a, b) => (pnum.get(a.problem_id) || 99) - (pnum.get(b.problem_id) || 99));
        const body = list.map((r) =>
          `# ===== 문제 ${pnum.get(r.problem_id) || "?"} — ${r.passed ? "통과" : "미통과"}${r.is_late ? " (지각)" : ""} =====\n${r.code || ""}\n`
        ).join("\n");
        zip.file(`${week}주차_${label}.py`, body);
      }
      prog.textContent = "압축 중…";
      const out = await zip.generateAsync({ type: "blob" });
      saveBlob(out, `${CONFIG.COURSE_NAME}_${week}주차_코드.zip`);
      prog.textContent = "";
    }

    async function renderDeadlines() {
      const { data: dls } = await sb.from("deadlines").select("*");
      const map = new Map((dls || []).map((d) => [d.week, d.due_at]));
      const weeks = Object.keys(counts).map(Number).sort((a, b) => a - b);
      const tbody = $("#deadline-table tbody");

      tbody.innerHTML = weeks.map((w) => {
        const info = weekInfo(w);
        const due = map.get(w);
        let val = "";
        if (due) {
          const d = new Date(due);
          const pad = (n) => String(n).padStart(2, "0");
          val = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        return `<tr>
          <td><strong>${w}주차</strong></td>
          <td>${esc(info ? info.title : "")}</td>
          <td><input type="datetime-local" id="due-${w}" value="${val}"
                     style="border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:inherit;"></td>
          <td><button class="btn btn-ghost btn-sm" data-save="${w}">저장</button></td>
        </tr>`;
      }).join("");

      $$("#deadline-table [data-save]").forEach((btn) => {
        btn.onclick = async () => {
          const w = Number(btn.dataset.save);
          const raw = $(`#due-${w}`).value;
          const due_at = raw ? new Date(raw).toISOString() : null;
          const { error } = await sb.from("deadlines").upsert({ week: w, due_at });
          if (error) toast("저장 실패: " + error.message, "error");
          else toast(`${w}주차 마감일이 저장되었습니다.`, "ok");
        };
      });
    }

    function renderStudents() {
      $("#student-count").textContent = students.length;
      const totalProblems = Object.values(counts).reduce((a, b) => a + b, 0);
      const passedByUser = new Map();
      summary.forEach((s) => passedByUser.set(s.user_id, (passedByUser.get(s.user_id) || 0) + s.passed_count));

      const rosterIds = new Set(roster.map((r) => String(r.student_id).trim()));
      const signedIds = new Set(students.map((p) => String(p.student_id || "").trim()));

      $("#student-table tbody").innerHTML = students.map((p, i) => {
        const inRoster = !roster.length || rosterIds.has(String(p.student_id || "").trim());
        return `
        <tr>
          <td>${i + 1}</td>
          <td>${esc(p.student_id)}</td>
          <td>${esc(p.name)}</td>
          <td class="muted">${esc(p.email)}</td>
          <td>${fmtDate(p.created_at)}</td>
          <td>${passedByUser.get(p.id) || 0} / ${totalProblems}</td>
          <td>${roster.length ? (inRoster ? '<span class="chip chip-ok">명단 내</span>'
                                          : '<span class="chip chip-bad">명단 외</span>') : ""}</td>
        </tr>`;
      }).join("") || `<tr><td colspan="7" class="muted">아직 가입한 학생이 없습니다.</td></tr>`;

      // 출석부 대조: 미가입 학생
      if (roster.length) {
        const notSigned = roster.filter((r) => !signedIds.has(String(r.student_id).trim()));
        $("#roster-stats").innerHTML = `
          <div class="notice ${notSigned.length ? "notice-warn" : "notice-ok"}" style="margin-top:0;">
            출석부 명단 <strong>${roster.length}</strong>명 중
            가입 <strong>${roster.length - notSigned.length}</strong>명 ·
            미가입 <strong>${notSigned.length}</strong>명
          </div>`;
        $("#roster-missing-wrap").hidden = false;
        $("#roster-missing-count").textContent = notSigned.length;
        $("#roster-missing").innerHTML = notSigned.length
          ? notSigned.map((r) => `<span class="pill">${esc(r.student_id)} ${esc(r.name)}${r.dept ? ` <span class="muted">(${esc(r.dept)})</span>` : ""}</span>`).join("")
          : `<span class="muted">모든 학생이 가입했습니다 🎉</span>`;
      } else {
        $("#roster-stats").innerHTML = `
          <p class="muted" style="font-size:13px;">출석부 명단이 아직 등록되지 않았습니다.
          등록하면 미가입 학생을 확인할 수 있습니다 (tools/roster_import.sql 참고).</p>`;
      }
    }

    async function main() {
      await renderHeader("admin");
      const session = await getSession();
      const admin = session ? await checkAdmin() : false;
      if (!admin) {
        $("#guard").innerHTML = `
          <div class="notice notice-bad" style="margin-top:24px;">
            관리자 권한이 없습니다. 관리자 이메일로 <a href="login.html">로그인</a>해주세요.
          </div>`;
        return;
      }
      $("#panel").hidden = false;

      await loadRoster();

      const weeks = Object.keys(counts).map(Number).sort((a, b) => a - b);
      const sel = $("#week-select");
      sel.innerHTML = weeks.map((w) => {
        const info = weekInfo(w);
        return `<option value="${w}">${w}주차 — ${esc(info ? info.title : "")}</option>`;
      }).join("");

      renderWeek(Number(sel.value));
      renderStudents();
      await renderDeadlines();

      sel.onchange = () => renderWeek(Number(sel.value));
      $("#btn-zip").onclick = () => downloadZip(Number(sel.value));
    }
    main();
  </script>
</body>
</html>
