<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미래교육2 — 강의자료 · 과제 제출</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="hero">
      <h1>미래교육2 <span style="font-weight:400;font-size:.6em;opacity:.85">OPEN 1003-00</span></h1>
      <p>설치 없이 브라우저에서 바로 파이썬 숙제를 풀 수 있습니다. 문제를 풀고 "채점"을 누르면 자동으로 기록됩니다. 숙제는 2주차부터 12주차까지 있습니다.</p>
    </div>

    <div id="login-callout"></div>

    <h2 class="section">주차별 자료 및 과제</h2>
    <div class="week-grid" id="week-grid"></div>
  </main>

  <footer class="site-footer">미래교육2 (OPEN 1003-00) · 경희대학교</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function main() {
      await renderHeader("home");
      const session = await getSession();

      // 로그인 안내
      if (!session) {
        $("#login-callout").innerHTML = `
          <div class="notice notice-info">
            과제를 제출하려면 <a href="login.html"><strong>학교 이메일(@${esc(CONFIG.EMAIL_DOMAIN)})로 로그인</strong></a>이 필요합니다.
            자료 다운로드는 로그인 없이 가능합니다.
          </div>`;
      }

      // 마감일 + 주차별 문제 수 + 내 풀이 현황 로드
      let deadlines = {};
      let counts = {};
      let myDone = {};   // week -> 통과한 문제 수
      try {
        const [dlRes, cntRes] = await Promise.all([
          sb.from("deadlines").select("*"),
          fetch("problems/index.json").then((r) => r.json()),
        ]);
        (dlRes.data || []).forEach((d) => { deadlines[d.week] = d.due_at; });
        counts = cntRes || {};
      } catch (e) { /* 설정 전이면 무시 */ }
      if (session) {
        const { data: rows } = await sb.from("hw_progress")
          .select("week, passed").eq("user_id", session.user.id).eq("passed", true);
        (rows || []).forEach((r) => { myDone[r.week] = (myDone[r.week] || 0) + 1; });
      }

      const grid = $("#week-grid");
      grid.innerHTML = CONFIG.WEEKS.map((w) => {
        const mats = w.materials.map((m) => {
          const preview = m.file.endsWith(".ipynb")
            ? ` <a href="viewer.html?src=${encodeURIComponent(m.file)}" title="브라우저에서 미리보기">👁</a>` : "";
          return `<a href="${m.file}" download>${esc(m.label)}</a>${preview}`;
        }).join("");

        let foot = "";
        const total = counts[String(w.week)] || 0;
        if (w.homework && total > 0) {
          const due = deadlines[w.week];
          const passed = due && new Date(due) < new Date();
          const dueHtml = due
            ? `<span class="deadline ${passed ? "passed" : ""}">마감 ${fmtDate(due)}</span>`
            : `<span class="deadline">마감일 미정</span>`;

          const done = myDone[w.week] || 0;
          let chip = "";
          if (session) {
            if (done >= total) chip = `<span class="chip chip-ok">완료 ${done}/${total}</span>`;
            else if (done > 0) chip = `<span class="chip chip-warn">진행 중 ${done}/${total}</span>`;
            else chip = `<span class="chip ${passed ? "chip-bad" : "chip-none"}">0/${total}</span>`;
          }
          foot = `
            <div class="week-foot">
              <div>${dueHtml} ${chip}</div>
              <a class="btn btn-sm ${done >= total && total > 0 ? "btn-outline" : "btn-primary"}" href="hw.html?week=${w.week}">
                숙제 풀기</a>
            </div>`;
        } else {
          foot = `<div class="week-foot"><span class="muted">제출 과제 없음</span></div>`;
        }

        return `
          <div class="week-card">
            <div class="week-head">
              <span class="week-num">${w.week}주차</span>
              <span class="week-title">${esc(w.title)}</span>
            </div>
            <div class="mat-links">${mats}</div>
            ${foot}
          </div>`;
      }).join("");
    }
    main();
  </script>
</body>
</html>
