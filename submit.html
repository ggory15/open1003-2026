<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>과제 제출 — 미래교육2</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container container-narrow">
    <div id="content" class="card" style="margin-top:24px;">
      <p class="muted">불러오는 중…</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    const week = Number(new URLSearchParams(location.search).get("week"));

    async function main() {
      await renderHeader("home");
      const box = $("#content");
      const info = weekInfo(week);

      if (!info || !info.homework) {
        box.innerHTML = `<p>이 주차에는 제출할 과제가 없습니다. <a href="index.html">홈으로</a></p>`;
        return;
      }
      const session = await getSession();
      if (!session) {
        location.href = "login.html";
        return;
      }

      // 프로필 확인 — 학번/이름이 비어 있으면 먼저 입력받음
      let profile = await getProfile();
      if (!profile || !profile.student_id || !profile.name) {
        box.innerHTML = `
          <h2 style="margin-top:0">프로필 입력</h2>
          <p class="muted">제출 전에 학번과 이름을 입력해주세요. (최초 1회)</p>
          <form id="form-profile">
            <label class="field">학번 <input id="pf-sid" required value="${esc(profile?.student_id || "")}"></label>
            <label class="field">이름 <input id="pf-name" required value="${esc(profile?.name || "")}"></label>
            <button class="btn btn-primary" type="submit">저장</button>
          </form>`;
        $("#form-profile").onsubmit = async (e) => {
          e.preventDefault();
          const { error } = await sb.from("profiles").upsert({
            id: session.user.id,
            email: session.user.email,
            student_id: $("#pf-sid").value.trim(),
            name: $("#pf-name").value.trim(),
          });
          if (error) toast("저장 실패: " + error.message, "error");
          else location.reload();
        };
        return;
      }

      // 마감일/기존 제출 조회
      const [{ data: dl }, { data: sub }] = await Promise.all([
        sb.from("deadlines").select("due_at").eq("week", week).maybeSingle(),
        sb.from("submissions").select("*").eq("user_id", session.user.id).eq("week", week).maybeSingle(),
      ]);
      const due = dl?.due_at || null;
      const passed = due && new Date(due) < new Date();

      let dueHtml = due
        ? (passed
            ? `<div class="notice notice-warn">마감(${fmtDate(due)})이 지났습니다. 지금 제출하면 <strong>지각 제출</strong>로 표시됩니다.</div>`
            : `<div class="notice notice-info">마감: <strong>${fmtDate(due)}</strong></div>`)
        : "";

      let subHtml = "";
      if (sub) {
        subHtml = `
          <div class="notice notice-ok">
            ${fmtDate(sub.submitted_at)}에 제출했습니다
            ${sub.is_late ? '<span class="chip chip-warn">지각</span>' : '<span class="chip chip-ok">정상</span>'}
            — <a href="viewer.html?week=${week}">제출본 미리보기</a><br>
            <span class="muted" style="font-size:13px">다시 제출하면 이전 파일을 덮어씁니다.</span>
          </div>`;
      }

      box.innerHTML = `
        <p style="margin-top:0"><a href="index.html">← 목록으로</a></p>
        <div class="week-head" style="margin-bottom:6px;">
          <span class="week-num">${week}주차</span>
          <span class="week-title" style="font-size:20px">${esc(info.title)} 과제 제출</span>
        </div>
        <p class="muted">제출자: ${esc(profile.name)} (${esc(profile.student_id)})</p>
        <p>숙제 파일: <a href="${info.homework}" download>${esc(info.homework.split("/").pop())}</a>
           · <a href="viewer.html?src=${encodeURIComponent(info.homework)}">미리보기</a></p>
        ${dueHtml}
        ${subHtml}
        <div class="dropzone" id="dropzone">
          <strong>여기를 클릭</strong>하거나 완성한 <strong>.ipynb 파일</strong>을 끌어다 놓으세요
          <div id="picked" style="margin-top:8px;font-size:14px;"></div>
        </div>
        <input type="file" id="file-input" accept=".ipynb,application/json" hidden>
        <div style="margin-top:16px;">
          <button class="btn btn-primary btn-block" id="btn-upload" disabled>${sub ? "다시 제출하기" : "제출하기"}</button>
        </div>`;

      // 파일 선택 / 드래그앤드롭
      const dz = $("#dropzone"), input = $("#file-input"), btn = $("#btn-upload");
      let picked = null;

      async function choose(file) {
        if (!file) return;
        if (!file.name.toLowerCase().endsWith(".ipynb")) {
          toast(".ipynb 파일만 제출할 수 있습니다.", "error");
          return;
        }
        try {
          const nb = JSON.parse(await file.text());
          if (!Array.isArray(nb.cells)) throw new Error("no cells");
        } catch {
          toast("올바른 Jupyter 노트북 파일이 아닙니다.", "error");
          return;
        }
        picked = file;
        $("#picked").innerHTML = `선택됨: <strong>${esc(file.name)}</strong> (${(file.size / 1024).toFixed(1)} KB)`;
        btn.disabled = false;
      }

      dz.onclick = () => input.click();
      input.onchange = () => choose(input.files[0]);
      dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("dragover"); };
      dz.ondragleave = () => dz.classList.remove("dragover");
      dz.ondrop = (e) => {
        e.preventDefault(); dz.classList.remove("dragover");
        choose(e.dataTransfer.files[0]);
      };

      btn.onclick = async () => {
        if (!picked) return;
        btn.disabled = true;
        btn.textContent = "업로드 중…";
        const path = `${session.user.id}/week${week}.ipynb`;

        const { error: upErr } = await sb.storage.from("submissions")
          .upload(path, picked, { upsert: true, contentType: "application/json" });
        if (upErr) {
          toast("업로드 실패: " + upErr.message, "error");
          btn.disabled = false; btn.textContent = "제출하기";
          return;
        }
        const { error: dbErr } = await sb.from("submissions").upsert(
          { user_id: session.user.id, week, file_path: path, original_filename: picked.name },
          { onConflict: "user_id,week" });
        if (dbErr) {
          toast("제출 기록 저장 실패: " + dbErr.message, "error");
          btn.disabled = false; btn.textContent = "제출하기";
          return;
        }
        toast("제출이 완료되었습니다!", "ok");
        setTimeout(() => location.reload(), 900);
      };
    }
    main();
  </script>
</body>
</html>
